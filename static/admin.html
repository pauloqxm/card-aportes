<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração — Card Reservatórios</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app admin-app">
    <header class="header">
      <img src="/static/logo_cogerh.png" alt="COGERH" class="logo-img" style="max-width: 160px; height: auto; display: block; margin: 0 auto 0.75rem;">
      <h1>Área administrativa</h1>
      <p class="tagline">Acesso restrito a usuários autorizados.</p>
    </header>

    <main class="main">
      <div id="admin-login-box" class="card admin-login">
        <h2>Entrar</h2>
        <form id="login-form">
          <label for="admin-user">Usuário</label>
          <input type="text" id="admin-user" name="username" autocomplete="username" required>
          <label for="admin-password">Senha</label>
          <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
          <p id="login-error" class="status error" aria-live="polite" hidden></p>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </div>

      <div id="admin-dashboard" class="card admin-dashboard" hidden>
        <h2>Bem-vindo, <span id="admin-username"></span></h2>
        <p>Você está autenticado na área administrativa.</p>
        <a href="/" class="btn btn-small">Voltar ao gerador de cards</a>
        <button type="button" id="admin-logout" class="btn btn-small">Sair</button>
      </div>
    </main>

    <footer class="footer">
      <p class="footer-org">COGERH — Companhia de Gestão dos Recursos Hídricos</p>
    </footer>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
